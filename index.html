<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="theme-color" content="#0f7b6c">
<title>Expenses</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#76746d;--ac:#0f7b6c;--bd:#e3e1d9;--dn:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--tx:#eeede8;--mu:#9b9990;--ac:#3fbfa9;--bd:#34332f;--dn:#ef7a6c}}
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2,summary{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 10px;font-weight:600}
summary{cursor:pointer;margin:0}
details[open] summary{margin-bottom:10px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{font-size:18px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 13px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px}
.stat small{color:var(--mu);display:block;font-size:12px}
.stat b{font-size:18px}.big b{font-size:26px}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.sync{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:13px;color:var(--mu)}
.sync button{flex:none;padding:6px 12px}
.bar{margin:8px 0}.bar .t{display:flex;justify-content:space-between;font-size:14px}
.bar .b{height:8px;border-radius:4px;background:var(--bg);margin-top:3px;overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--ac)}
.day{display:flex;justify-content:space-between;font-weight:600;margin:14px 0 4px;font-size:14px}
.day span:last-child{color:var(--ac)}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.item .m{flex:1;min-width:0}
.item .m small{color:var(--mu);display:block}
.item .a{font-weight:600;white-space:nowrap}
.x{padding:4px 10px;color:var(--dn)}
.x.sure{background:var(--dn);color:#fff;border-color:var(--dn)}
.msg{color:var(--mu);font-size:13px;min-height:18px;margin-top:6px}
.err{color:var(--dn)}
label{font-size:12px;color:var(--mu);display:block;margin:0 0 3px}
.f{margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{padding:6px 12px;border-radius:999px;font-size:14px}
.amt{display:flex;gap:6px}.amt input{min-width:0}
.amt button{flex:none;padding:0 15px;font-weight:700;font-size:18px}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="nav"><button id="prev" aria-label="Previous month">&lsaquo;</button><b id="mon"></b><button id="next" aria-label="Next month">&rsaquo;</button></div>
    <div class="stat big"><small>Month total</small><b id="total"></b></div>
    <div class="grid" style="margin-top:10px">
      <div class="stat"><small>Today</small><b id="today"></b></div>
      <div class="stat"><small>Daily average</small><b id="avg"></b></div>
    </div>
    <div class="sync"><span id="status"></span><button id="syncbtn">Sync</button></div>
  </div>

  <div class="card">
    <h2 id="ftitle">Add expense</h2>
    <div class="chips" id="chips" style="display:none"></div>
    <div class="grid">
      <div><label id="lblamt">Amount (e.g. 6+4.5)</label><div class="amt"><input id="amt" autocomplete="off" inputmode="decimal"><button type="button" id="plus" aria-label="Add another amount">+</button></div></div>
      <div><label>Date</label><input id="date" type="date"></div>
      <div><label>Note (optional)</label><input id="note" list="notes" autocomplete="off"><datalist id="notes"></datalist></div>
      <div><label>Category</label><select id="cat"></select></div>
    </div>
    <div class="row"><button class="p" id="save">Add</button><button id="cancel" style="display:none">Cancel</button></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card"><h2>By category</h2><div id="cats"></div></div>
  <div class="card"><h2>History</h2><div id="list"></div></div>

  <details class="card" id="set">
    <summary>Sync &amp; settings</summary>
    <div class="f"><label>Sync link (ends with /exec)</label><input id="url" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="f"><label>Password</label><input id="tok" type="password" autocomplete="off"></div>
    <div class="f"><label>Currency label</label><input id="cur" maxlength="5"></div>
    <div class="row"><button class="p" id="ssave">Save &amp; sync</button><button id="sreset">Re-download all</button></div>
    <div class="msg" id="smsg"></div>
    <div class="msg">Expense Tracker phone v2.2.0. Entries are saved on this phone first, then synced.</div>
  </details>
</main>
<script>
(function () {
var VER = '2.2.0', K = 'expense-phone-v1';
var CATS = ['Food', 'Transport', 'Shopping', 'Family', 'Phone', 'Bills', 'Health', 'Other'];
var S = { url: '', token: '', cur: 'RM', rows: [], seq: 0, lastPush: '', lastSync: '' };
var $ = function (s) { return document.querySelector(s); };
function pad(n) { return (n < 10 ? '0' : '') + n; }
function localDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
var todayS = localDate(new Date()), ym = todayS.slice(0, 7);
var editUid = null, pend = null, touched = false, syncing = false, lastTry = 0, queued = false, chipList = [];

function stampAfter(old, n) {
  if (old && n <= old) { var t = Date.parse(old); if (!isNaN(t)) n = new Date(t + 1000).toISOString().slice(0, 19) + 'Z'; }
  return n;
}
function nowIso() { return new Date().toISOString().slice(0, 19) + 'Z'; }
function genUid() {
  var a = new Uint8Array(16);
  try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < 16; i++) a[i] = Math.floor(Math.random() * 256); }
  return Array.prototype.map.call(a, function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
}
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(c) { return S.cur + ' ' + Math.floor(c / 100).toLocaleString('en-US') + '.' + pad(c % 100); }
function plain(c) { return Math.floor(c / 100) + '.' + pad(c % 100); }
function parseAmt(s) {
  var parts = String(s).replace(/[,\s]/g, '').split('+'), t = 0;
  for (var i = 0; i < parts.length; i++) {
    var m = /^(\d+)(?:\.(\d{1,2}))?$/.exec(parts[i]);
    if (!m) return null;
    t += parseInt(m[1], 10) * 100 + (m[2] ? parseInt((m[2] + '0').slice(0, 2), 10) : 0);
  }
  return t > 0 && t < 1e11 ? t : null;
}
function load() {
  try { var r = localStorage.getItem(K); if (r) { var o = JSON.parse(r); for (var k in o) S[k] = o[k]; } } catch (e) {}
  if (!Array.isArray(S.rows)) S.rows = [];
}
function save() { try { localStorage.setItem(K, JSON.stringify(S)); return true; } catch (e) { setStatus('Cannot save on this phone (private mode?)', true); return false; } }
function live() { return S.rows.filter(function (r) { return !r.deleted; }); }
function find(uid) { for (var i = 0; i < S.rows.length; i++) if (S.rows[i].uid === uid) return S.rows[i]; return null; }
function configured() { return !!(S.url && S.token); }

function setStatus(t, err) { var s = $('#status'); s.textContent = t; s.className = err ? 'err' : ''; }
function setSMsg(t, err) { var s = $('#smsg'); s.textContent = t; s.className = 'msg' + (err ? ' err' : ''); }
function setMsg(t, err) { var s = $('#msg'); s.textContent = t; s.className = 'msg' + (err ? ' err' : ''); }

function render() {
  var p = ym.split('-'), dim = new Date(+p[0], +p[1], 0).getDate();
  $('#mon').textContent = new Date(+p[0], +p[1] - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  var all = live(), tx = all.filter(function (r) { return r.date.slice(0, 7) === ym; });
  var total = tx.reduce(function (s, r) { return s + r.amount_cents; }, 0);
  var cur = todayS.slice(0, 7), days = ym === cur ? +todayS.slice(8) : (ym < cur ? dim : 0);
  $('#total').textContent = money(total);
  $('#avg').textContent = days ? money(Math.round(total / days)) : '-';
  $('#today').textContent = money(all.filter(function (r) { return r.date === todayS; }).reduce(function (s, r) { return s + r.amount_cents; }, 0));

  var by = {};
  tx.forEach(function (r) { by[r.category] = (by[r.category] || 0) + r.amount_cents; });
  var keys = Object.keys(by).sort(function (a, b) { return by[b] - by[a]; });
  $('#cats').innerHTML = keys.length ? keys.map(function (k) {
    var pc = total ? by[k] * 100 / total : 0;
    return '<div class="bar"><div class="t"><span>' + esc(k) + '</span><span>' + money(by[k]) + ' &middot; ' + pc.toFixed(0) + '%</span></div><div class="b"><i style="width:' + pc + '%"></i></div></div>';
  }).join('') : '<div class="msg">No expenses this month.</div>';

  var g = {};
  tx.forEach(function (r) { (g[r.date] = g[r.date] || []).push(r); });
  var h = '';
  Object.keys(g).sort().reverse().forEach(function (d) {
    var items = g[d].slice().sort(function (a, b) { return a.updated_at < b.updated_at ? 1 : -1; });
    var sum = items.reduce(function (s, r) { return s + r.amount_cents; }, 0);
    var dt = new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8));
    h += '<div class="day"><span>' + dt.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) + '</span><span>' + money(sum) + '</span></div>';
    items.forEach(function (r) {
      h += '<div class="item"><div class="m" data-edit="' + r.uid + '"><span>' + esc(r.note || r.category) + '</span><small>' + esc(r.category) + '</small></div><span class="a">' + money(r.amount_cents) + '</span><button class="x' + (pend === r.uid ? ' sure' : '') + '" data-del="' + r.uid + '">' + (pend === r.uid ? 'Sure?' : '&times;') + '</button></div>';
    });
  });
  $('#list').innerHTML = h || '<div class="msg">Nothing here yet.</div>';

  var cnt = Object.create(null);
  all.forEach(function (r) {
    if (!r.note) return;
    var k = r.note.toLowerCase(), c = cnt[k];
    if (!c) c = cnt[k] = { n: 0, last: r };
    c.n++;
    if (r.date > c.last.date || (r.date === c.last.date && r.updated_at >= c.last.updated_at)) c.last = r;
  });
  chipList = Object.keys(cnt).filter(function (k) { return cnt[k].n >= 2; }).sort(function (a, b) {
    return (cnt[b].n - cnt[a].n) || (cnt[a].last.date < cnt[b].last.date ? 1 : (cnt[a].last.date > cnt[b].last.date ? -1 : 0));
  }).slice(0, 6).map(function (k) { return cnt[k].last; });
  var cb = $('#chips');
  cb.style.display = chipList.length ? '' : 'none';
  cb.innerHTML = chipList.map(function (r, i) {
    var n = r.note.length > 14 ? r.note.slice(0, 13) + '\u2026' : r.note;
    return '<button type="button" data-chip="' + i + '">' + esc(n) + ' ' + plain(r.amount_cents) + '</button>';
  }).join('');

  var seen = {}, notes = [];
  all.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (r) {
    if (r.note && !seen[r.note] && notes.length < 40) { seen[r.note] = 1; notes.push(r.note); }
  });
  $('#notes').innerHTML = notes.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
}

function calc() {
  var t = $('#amt').value, c = t.indexOf('+') >= 0 ? parseAmt(t) : null;
  $('#lblamt').textContent = c ? 'Amount  =  ' + money(c) : 'Amount (e.g. 6+4.5)';
}
function useChip(i) {
  var r = chipList[i];
  if (!r) return;
  if (editUid) { setMsg('Finish or cancel the edit first.', true); return; }
  $('#note').value = r.note; $('#cat').value = CATS.indexOf(r.category) >= 0 ? r.category : 'Other'; touched = true;
  $('#amt').value = plain(r.amount_cents); calc();
  $('#amt').focus(); try { $('#amt').select(); } catch (e) {}
  setMsg('Filled from your last one. Change the amount if needed, then tap Add.');
}
function autofill() {
  var n = $('#note').value.trim().toLowerCase();
  if (editUid || touched || !n) return;
  var best = null;
  live().forEach(function (r) {
    if (r.note.toLowerCase() === n && (!best || r.date > best.date || (r.date === best.date && r.updated_at > best.updated_at))) best = r;
  });
  if (best && CATS.indexOf(best.category) >= 0) $('#cat').value = best.category;
}
function resetForm() {
  editUid = null; touched = false;
  $('#amt').value = ''; $('#note').value = ''; $('#cat').value = CATS[0]; $('#date').value = todayS; calc();
  $('#save').textContent = 'Add'; $('#cancel').style.display = 'none'; $('#ftitle').textContent = 'Add expense';
}
function submit() {
  var a = parseAmt($('#amt').value), d = $('#date').value;
  if (a === null) { setMsg('Enter a valid amount, like 7.5 or 6+4.5', true); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { setMsg('Pick a date', true); return; }
  autofill();
  var cat = $('#cat').value, note = $('#note').value.trim().slice(0, 200), now = nowIso();
  if (editUid) {
    var r = find(editUid);
    if (r) { r.date = d; r.amount_cents = a; r.category = cat; r.note = note; r.updated_at = stampAfter(r.updated_at, now); }
    setMsg('Updated.');
  } else {
    S.rows.push({ uid: genUid(), date: d, amount_cents: a, category: cat, note: note, updated_at: now, deleted: 0 });
    setMsg('Added ' + money(a) + ' (' + cat + ').');
  }
  save(); ym = d.slice(0, 7); resetForm(); render(); syncSoon();
}

function post(payload) {
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = ctl ? setTimeout(function () { ctl.abort(); }, 30000) : null;
  return fetch(S.url, { method: 'POST', body: JSON.stringify(payload), signal: ctl ? ctl.signal : undefined })
    .then(function (r) { if (timer) clearTimeout(timer); return r.json(); });
}
function syncSoon() { if (syncing) queued = true; else sync(true); }
function sync(silent, again) {
  if (syncing) return Promise.resolve();
  if (!configured()) { if (!silent) { $('#set').open = true; setSMsg('Enter the sync link and password first.', true); } setStatus('Sync not set up'); return Promise.resolve(); }
  syncing = true; lastTry = Date.now(); setStatus('Syncing...');
  var started = nowIso();
  var changes = S.rows.filter(function (r) { return r.updated_at >= S.lastPush; });
  return post({ action: 'sync', token: S.token, since: S.seq, changes: changes }).then(function (resp) {
    if (!resp || !resp.ok) throw new Error((resp && resp.error) || 'Sync failed.');
    if (S.seq > resp.seq && !again) {   // online sheet was reset: send everything again
      S.seq = 0; S.lastPush = ''; save(); syncing = false; return sync(silent, true);
    }
    var added = 0, upd = 0;
    (resp.rows || []).forEach(function (r) {
      if (!r || typeof r.uid !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(r.date) || !(r.amount_cents >= 0)) return;
      var row = { uid: r.uid, date: r.date, amount_cents: Math.floor(r.amount_cents), category: CATS.indexOf(r.category) >= 0 ? r.category : 'Other', note: String(r.note || ''), updated_at: String(r.updated_at), deleted: r.deleted ? 1 : 0 };
      var l = find(r.uid);
      if (!l) { S.rows.push(row); added++; }
      else if (row.updated_at > l.updated_at) { for (var k in row) l[k] = row[k]; upd++; }
    });
    S.seq = resp.seq; S.lastPush = started; S.lastSync = new Date().toISOString(); save();
    var t = new Date();
    setStatus('Synced ' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + (added || upd ? ' (+' + added + ' new, ' + upd + ' changed)' : ''));
    setSMsg(resp.rejected ? resp.rejected + ' entries could not be uploaded.' : 'Synced.', !!resp.rejected);
    syncing = false; render();
    if (queued) { queued = false; setTimeout(function () { sync(true); }, 200); }
  }).catch(function (e) {
    syncing = false; queued = false;
    var m = e && e.name === 'AbortError' ? 'Took too long' : (e && e.message) || 'Offline';
    if (/Failed to fetch|NetworkError|Load failed|fetch/i.test(m)) m = 'Offline: saved on this phone, will sync later';
    setStatus(m, true); setSMsg(m, true);
  });
}

function boot() {
  load();
  $('#cat').innerHTML = CATS.map(function (c) { return '<option>' + c + '</option>'; }).join('');
  $('#date').value = todayS; $('#url').value = S.url; $('#tok').value = S.token; $('#cur').value = S.cur;
  $('#prev').onclick = function () { shift(-1); }; $('#next').onclick = function () { shift(1); };
  $('#save').onclick = submit;
  $('#cancel').onclick = function () { resetForm(); setMsg(''); };
  $('#amt').onkeydown = function (e) { if (e.key === 'Enter') submit(); };
  $('#amt').oninput = calc;
  $('#plus').onmousedown = function (e) { e.preventDefault(); };
  $('#plus').onclick = function () {
    var a = $('#amt'), v = a.value.trim();
    if (v && v.slice(-1) !== '+') a.value = v + '+';
    a.focus(); calc();
  };
  $('#note').onchange = autofill; $('#note').onblur = autofill;
  $('#cat').onchange = function () { touched = true; };
  $('#syncbtn').onclick = function () { sync(false); };
  $('#ssave').onclick = function () {
    var u = $('#url').value.trim();
    if (u && (!/^https:\/\//.test(u) || /\/dev$/.test(u))) { setSMsg('Use the link that starts with https:// and ends with /exec', true); return; }
    if (u !== S.url) { S.seq = 0; S.lastPush = ''; }
    S.url = u; S.token = $('#tok').value; S.cur = $('#cur').value.trim() || 'RM';
    save(); render(); sync(false);
  };
  $('#sreset').onclick = function () { S.seq = 0; S.lastPush = ''; save(); sync(false); };
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-del],[data-edit],[data-chip]') : null;
    if (!t) return;
    if (t.dataset.chip !== undefined) { useChip(+t.dataset.chip); return; }
    if (t.dataset.del) {
      var r = find(t.dataset.del);
      if (pend === t.dataset.del) { if (r) { r.deleted = 1; r.updated_at = stampAfter(r.updated_at, nowIso()); } pend = null; save(); render(); syncSoon(); }
      else { pend = t.dataset.del; render(); }
    } else {
      var x = find(t.dataset.edit); if (!x) return;
      editUid = x.uid; $('#amt').value = plain(x.amount_cents); calc(); $('#date').value = x.date; $('#note').value = x.note; $('#cat').value = x.category;
      $('#save').textContent = 'Save changes'; $('#cancel').style.display = ''; $('#ftitle').textContent = 'Edit expense';
      setMsg('Editing. Change anything and save.'); window.scrollTo(0, 0);
    }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && configured() && Date.now() - lastTry > 60000) sync(true); });
  window.addEventListener('online', function () { if (configured()) sync(true); });
  setInterval(function () { if (!document.hidden && configured() && !syncing) sync(true); }, 120000);
  function shift(n) { var p = ym.split('-'), d = new Date(+p[0], +p[1] - 1 + n, 1); ym = d.getFullYear() + '-' + pad(d.getMonth() + 1); pend = null; render(); }
  setStatus(configured() ? (S.lastSync ? 'Last sync ' + new Date(S.lastSync).toLocaleString() : 'Not synced yet') : 'Sync not set up');
  render();
  if (configured()) sync(true); else $('#set').open = true;
}
boot();
})();
</script>
</body>
</html>
